# =============================================================================
#  tree-sitter-angular-html · GitHub Actions
# -----------------------------------------------------------------------------
#  File                gala-release.yml
#  Workflow name       Release
#  Type                Entrypoint (runs in this repo only)
#  Triggers            push (main), workflow_dispatch
#  Purpose             Runs gala to cut a release from the Conventional Commits
#                      on main: bumps the Cargo.toml version, writes the
#                      CHANGELOG.md entry, commits it, creates the v* tag,
#                      pushes the commit and tag together, fast-forwards dev to
#                      the release commit, and creates the GitHub Release.
#                      When no release is due the run does nothing.
#                      This repository has no publish workflow, so a release
#                      stops at the GitHub Release; nothing is published to
#                      crates.io or npm.
#                      The pushes go over the RELEASE_DEPLOY_KEY deploy key
#                      because the rulesets block direct pushes to main and dev
#                      and creating v* tags; the deploy key is the ruleset
#                      bypass actor. The release commit carries a skip-ci marker
#                      so it does not trigger this workflow again.
# =============================================================================

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: gala release
    # Job-level elevation: creating the GitHub Release through GITHUB_TOKEN
    # needs write access (the git pushes authenticate with the deploy key).
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (gala reads tags and history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # origin becomes an SSH remote authenticated by the deploy key, so
          # gala's atomic push and dev sync use the ruleset bypass.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false

      - name: Install gala
        run: go install github.com/alfpricot/gala/cmd/gala@v0.2.0

      - name: Install Rust toolchain
        # gala's cargo manager runs cargo to refresh the lockfile.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0 rustc stable as of 2026-08-17 (action itself publishes no version tags)

      - name: Configure git identity
        # The release commit is made by gala with the runner's git; without an
        # identity git refuses to commit at all.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gala release
