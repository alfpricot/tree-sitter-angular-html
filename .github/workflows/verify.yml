# =============================================================================
#  tree-sitter-angular-html · GitHub Actions
# -----------------------------------------------------------------------------
#  File                verify.yml
#  Workflow name       Verify
#  Type                Entrypoint (runs in this repo only)
#  Triggers            pull_request
#                      push (dev, main)
#                      workflow_dispatch
#  Purpose             Regenerate the parser from grammar.js and fail on any
#                      drift in the generated parser or the committed
#                      node-kind snapshot, lint and format-check the grammar
#                      and tooling JavaScript, run the corpus and highlight
#                      tests, parse every fixture and fail on any
#                      ERROR/MISSING/zero-width node, build and test the Rust
#                      and Node bindings, validate the PR title, scan the
#                      working tree and Git history for secrets, and lint
#                      workflow/YAML files. A final aggregate job rolls every
#                      check up into a single `Verify` status for branch
#                      rulesets to require.
#
#                      workflow_dispatch lets a maintainer run the checks by
#                      hand on any branch.
# =============================================================================

name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # A PR title/body edit must never cancel an in-flight build of this head.
  cancel-in-progress: ${{ github.event.action != 'edited' }}

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate conventional PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            revert
            ci
            build
            security

  secret-scanning:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Gitleaks
        id: cache-gitleaks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-linux-x64

      - name: Install Gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          asset="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tmp/$asset" "$base/$asset"
          curl -sSfL -o "$tmp/checksums.txt" "$base/gitleaks_${VERSION}_checksums.txt"
          ( cd "$tmp" && grep " $asset\$" checksums.txt | sha256sum --check - )
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tmp/$asset" -C "$tmp" gitleaks
          install -m 0755 "$tmp/gitleaks" "$HOME/.local/bin/gitleaks"

      - name: Scan the working tree with Gitleaks
        run: $HOME/.local/bin/gitleaks detect --no-git --source . --exit-code 1 --report-format json --report-path gitleaks-report.json

      - name: Scan Git history with Gitleaks
        run: $HOME/.local/bin/gitleaks detect --source . --exit-code 1 --report-format json --report-path gitleaks-history-report.json

      - name: Upload Gitleaks report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  verify:
    name: Grammar, fixtures, Rust build/test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0 rustc stable as of 2026-08-17 (action itself publishes no version tags)
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install the tree-sitter CLI
        run: |
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli

      - name: Regenerate the parser from grammar.js
        run: npx --no-install tree-sitter generate

      - name: Fail if the generated parser is out of date
        run: git diff --exit-code -- src/parser.c src/grammar.json src/node-types.json

      - name: Fail if the node-kind snapshot is out of date
        run: node tools/node-kinds.mjs --check

      - name: Lint the grammar and tooling JS
        run: npm run lint

      - name: Check formatting of the grammar and tooling JS
        run: npm run format:check

      - name: Test the release policy scripts
        run: node --test tools/*.test.mjs

      - name: Check Cargo.toml, package.json, and tree-sitter.json agree
        # gala refuses to plan a release when they disagree; failing here
        # catches the drift on the pull request instead of on main.
        run: node tools/release-policy.mjs versions

      - name: Run corpus and highlight tests
        run: npx --no-install tree-sitter test

      - name: Parse every fixture and fail on ERROR/MISSING or zero-width nodes
        run: node tools/fixture-check.mjs

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo build & test
        run: cargo test

      - name: Verify publishable package contents
        # The same crate and npm package checks release.yml runs before
        # publishing, so a packaging gap fails here first.
        run: node tools/package-check.mjs

  node-binding:
    name: Node binding build/test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Install dependencies and build the native addon
        run: npm ci

      - name: Run the Node binding tests
        run: npm test

  workflow-meta:
    name: Workflow and YAML checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: '1.7.12'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache actionlint
        id: cache-actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/actionlint
          key: actionlint-linux-amd64-${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ env.ACTIONLINT_VERSION }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          asset="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$tmp/$asset" "$base/$asset"
          curl -sSfL -o "$tmp/checksums.txt" "$base/actionlint_${VERSION}_checksums.txt"
          ( cd "$tmp" && grep " $asset\$" checksums.txt | sha256sum --check - )
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tmp/$asset" -C "$tmp" actionlint
          install -m 0755 "$tmp/actionlint" "$HOME/.local/bin/actionlint"

      - name: Run actionlint
        run: $HOME/.local/bin/actionlint -color -ignore 'SC[0-9]+:(info|style):'

      - name: Validate YAML files
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 - <<'PYEOF'
          import sys
          import yaml
          from pathlib import Path

          ignored = {".git", "node_modules", "target", "dist"}
          failures = []
          for path in Path(".").rglob("*.y*ml"):
              if any(part in ignored for part in path.parts):
                  continue
              try:
                  with path.open("r", encoding="utf-8") as f:
                      list(yaml.safe_load_all(f))
              except yaml.YAMLError as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("Invalid YAML found:")
              for failure in failures:
                  print(f"  {failure}")
              sys.exit(1)
          print("All YAML files parsed cleanly.")
          PYEOF

  ci:
    # A dispatched run must report as `Verify` too: it is how a
    # GITHUB_TOKEN-pushed release or sync branch satisfies the required check.
    name: ${{ github.event_name == 'push' && 'Verify (push)' || 'Verify' }}
    needs: [verify, node-binding, secret-scanning, pr-title, workflow-meta]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed (pr-title may skip outside PRs)
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq -e '
            to_entries
            | all(.value.result == "success" or (.key == "pr-title" and .value.result == "skipped"))
          '
