[package]
name = "tree-sitter-angular-html"
description = "Tree-sitter grammar for Angular HTML templates"
version = "0.2.0"
authors = ["M. Reifschneider"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "angular", "html"]
categories = ["parsing", "parser-implementations", "text-editors"]
repository = "https://github.com/alfpricot/tree-sitter-angular-html.git"
edition = "2024"
rust-version = "1.85"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["/LICENSE", "/NOTICE", "/README.md", "/tree-sitter.json", "/bindings/rust/*", "/grammar.js", "/grammar/**", "/queries/*", "/src/**"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "~1.10.0"

[dev-dependencies]
# Dev-only: the published crate's runtime dependency is
# `tree-sitter-language`, so a consumer's own `tree-sitter` version governs.
tree-sitter = "~0.27.0"
